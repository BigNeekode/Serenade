[package]
name = "app"
version = "0.1.0"
description = "Serenade — a control interface for Secondhand (hand)"
authors = ["Serenade"]
license = "MIT"
repository = "https://github.com/BigNeekode/Serenade"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
wait-timeout = "0.2"
which = "7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
zip = "2"
sha2 = "0.10"
hex = "0.4"
